<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Definir nova senha - Tem de Tudo</title>
  <meta name="theme-color" content="#ffffff" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="/img/logo.png" />
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <link href="/css/tdt-ui.css?v=20260728-ui32" rel="stylesheet" />
  <script src="/js/tdt-app.js?v=20260728-ui32"></script>
</head>
<body class="ap-authbody" data-page="reset_password">

<section class="ap-auth__brand">
  <a class="ap-auth__logo" href="/">
    <img src="/img/logo.png" alt="" style="width:38px;height:38px;border-radius:12px;object-fit:contain;background:#fff;padding:4px" />
    Tem de Tudo
  </a>
  <div class="ap-auth__claim">
    <h1>Só falta a<br>senha nova.</h1>
    <p>Depois de salvar, você entra direto. As sessões abertas em outros aparelhos são encerradas.</p>
    
  </div>
</section>

<section class="ap-auth__form">
  <button class="ap-themebtn ap-auth__theme" type="button" data-tdt-theme-toggle>
    <span class="material-symbols-outlined" data-tdt-theme-icon>dark_mode</span>
    <span data-tdt-theme-label>Escuro</span>
  </button>
  <div class="ap-auth__box">
    <h2 class="ap-auth__t">Definir nova senha</h2>
    <p class="ap-auth__s">Escolha uma senha com pelo menos 8 caracteres, com letras e números.</p>

    <form id="rpForm">
      <input id="rpToken" type="hidden" />
      <div class="ap-field">
        <label class="ap-field__l" for="rpEmail">E-mail</label>
        <input class="ap-input" id="rpEmail" type="email" placeholder="voce@email.com" autocomplete="email" />
      </div>
      <div class="ap-field">
        <label class="ap-field__l" for="rpPass">Nova senha</label>
        <input class="ap-input" id="rpPass" type="password" placeholder="Mínimo de 8 caracteres" autocomplete="new-password" />
      </div>
      <div class="ap-field">
        <label class="ap-field__l" for="rpPassConf">Repetir a senha</label>
        <input class="ap-input" id="rpPassConf" type="password" placeholder="Digite de novo" autocomplete="new-password" />
      </div>
      <button class="ap-btn" type="submit">Salvar e entrar</button>
      <p id="rpMessage" style="margin:14px 0 0;font-size:13.5px;text-align:center;color:var(--text-muted)"></p>
    </form>

    <p class="ap-auth__foot">O link expira em 60 minutos. <a href="/forgot_password.html" class="ap-link">Pedir outro</a></p>
  </div>
</section>

<script src="/dist/stitch-app.min.js?v=20260721-app52"></script>
</body>
</html>
