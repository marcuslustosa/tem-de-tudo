<script src="/dist/stitch-app.min.js?v=20260721-app51"></script>
  <!-- Scanner de camera: este script existia na versao anterior e se perdeu na
       reescrita da tela. Sem ele a camera nunca liga. -->
  <script>
(function () {
  const video = document.getElementById('qrVideo');
  const statusText = document.getElementById('scanStatus');
  const placeholder = document.getElementById('qrPlaceholder');
  const successIndicator = document.getElementById('scanSuccess');
  const toggleFlashBtn = document.getElementById('toggleFlash');
  const switchCameraBtn = document.getElementById('switchCamera');

  let stream = null;
  let facingMode = 'environment';
  let scanning = true;
  let lastScannedCode = null;
  let lastScanTime = 0;
  const scanCooldown = 3000;

  // Fluxo único de QR: o cliente lê o QR da empresa. A empresa nunca escaneia
  // ninguém nesta página — ela apenas exibe o QR da loja (injetado pelo bundle).
  const storedUser = JSON.parse(localStorage.getItem('tem_de_tudo_user') || '{}');
  const perfil = (storedUser.perfil || storedUser.role || '').toLowerCase();
  const isEmpresa = ['empresa', 'estabelecimento', 'parceiro'].includes(perfil);
  const instructionEl = document.getElementById('scanInstructions');
  let appReady = Boolean(window.__tdtAppReady);
  let scanPending = false;

  if (instructionEl && !isEmpresa) {
    instructionEl.textContent = 'Escaneie o QR da empresa para se vincular no app.';
  }

  const resetScannerUi = () => {
    successIndicator.classList.add('hidden');
    placeholder.classList.remove('hidden');
    statusText.classList.remove('text-error', 'text-primary', 'text-tertiary');
    statusText.textContent = 'Escaneie o QR da empresa...';
  };

  const resumeScanning = (delay = 0) => {
    setTimeout(() => {
      scanPending = false;
      resetScannerUi();
      scanning = true;
      requestAnimationFrame(scanQRCode);
    }, delay);
  };

  window.addEventListener('tdt-app-ready', () => {
    appReady = true;
  });

  window.addEventListener('tdt-qr-validation-result', (event) => {
    const result = event?.detail || {};
    if (result.source !== 'camera') return;

    successIndicator.classList.toggle('hidden', !result.ok);

    if (result.ok) {
      statusText.classList.remove('text-error');
      statusText.classList.add('text-tertiary');
      // Vínculo concluído: o bundle redireciona para a página da empresa.
      statusText.textContent = result.message || 'QR validado com sucesso.';
      return;
    }

    successIndicator.classList.add('hidden');
    statusText.classList.remove('text-primary', 'text-tertiary');
    statusText.classList.add('text-error');
    statusText.textContent = result.message || 'Nao foi possivel validar este QR.';
    resumeScanning(2600);
  });

  async function startCamera() {
    try {
      if (stream) {
        stream.getTracks().forEach((track) => track.stop());
      }

      const constraints = {
        video: {
          facingMode,
          width: { ideal: 1280 },
          height: { ideal: 720 },
        },
      };

      stream = await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject = stream;
      placeholder.classList.add('hidden');
      statusText.textContent = 'Camera ativa - escaneie o QR da empresa';

      requestAnimationFrame(scanQRCode);
    } catch (error) {
      const unsupportedCamera = ['NotSupportedError', 'NotFoundError', 'OverconstrainedError'].includes(error?.name || '');
      if (unsupportedCamera) {
        console.warn('camera_unavailable', error?.name || error);
        statusText.textContent = 'Camera indisponivel neste dispositivo ou navegador';
      } else if ((error?.name || '') === 'NotAllowedError') {
        console.warn('camera_permission_denied');
        statusText.textContent = 'Permita o acesso a camera para continuar';
      } else {
        console.warn('camera_start_failed', error?.name || error);
        statusText.textContent = 'Nao foi possivel iniciar a camera agora';
      }
      statusText.classList.add('text-error');
    }
  }

  function scanQRCode() {
    if (!scanning || video.readyState !== video.HAVE_ENOUGH_DATA) {
      if (scanning) requestAnimationFrame(scanQRCode);
      return;
    }

    const canvas = document.createElement('canvas');
    const context = canvas.getContext('2d');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    context.drawImage(video, 0, 0, canvas.width, canvas.height);

    const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
    const code = jsQR(imageData.data, imageData.width, imageData.height, {
      inversionAttempts: 'dontInvert',
    });

    if (code && code.data) {
      const now = Date.now();
      if (code.data !== lastScannedCode || (now - lastScanTime) > scanCooldown) {
        lastScannedCode = code.data;
        lastScanTime = now;
        handleQRCodeDetected(code.data);
      }
    }

    if (scanning) {
      requestAnimationFrame(scanQRCode);
    }
  }

  async function handleQRCodeDetected(qrData) {
    placeholder.classList.add('hidden');
    successIndicator.classList.remove('hidden');
    statusText.textContent = 'QR Code detectado! Validando...';
    statusText.classList.add('text-primary');

    if (navigator.vibrate) {
      navigator.vibrate(200);
    }

    if (!appReady) {
      statusText.textContent = 'Preparando validacao...';
      statusText.classList.remove('text-error');
      statusText.classList.add('text-tertiary');
      resumeScanning(900);
      return;
    }

    if (scanPending) {
      return;
    }

    scanPending = true;
    scanning = false;
    const manualInput = document.getElementById('cupomId');
    if (manualInput) manualInput.value = qrData;
    window.dispatchEvent(new CustomEvent('tdt-qr-scanned', {
      detail: {
        codigo: qrData,
        source: 'camera',
      },
    }));
    return;

  }

  toggleFlashBtn.addEventListener('click', async () => {
    if (!stream) return;

    const track = stream.getVideoTracks()[0];
    const capabilities = track.getCapabilities();

    if (!capabilities.torch) {
      alert('Lanterna não disponível neste dispositivo');
      return;
    }

    const current = track.getSettings();
    const newState = !current.torch;
    await track.applyConstraints({ advanced: [{ torch: newState }] });
    toggleFlashBtn.classList.toggle('bg-primary', newState);
    toggleFlashBtn.classList.toggle('text-white', newState);
  });

  switchCameraBtn.addEventListener('click', () => {
    facingMode = facingMode === 'environment' ? 'user' : 'environment';
    startCamera();
  });

  document.getElementById('closeQRScanner').addEventListener('click', () => {
    scanning = false;
    scanPending = false;
    if (stream) {
      stream.getTracks().forEach((track) => track.stop());
    }
    const fallback = isEmpresa ? '/dashboard_parceiro.html' : '/meus_pontos.html';
    const sameOriginReferrer = document.referrer && (() => {
      try {
        return new URL(document.referrer).origin === window.location.origin;
      } catch {
        return false;
      }
    })();
    if (window.history.length > 1 && sameOriginReferrer) {
      window.history.back();
      return;
    }
    window.location.href = fallback;
  });

  // A empresa NAO escaneia mais o cliente: o cliente e quem le o QR da empresa.
  // Nesta pagina, para a empresa, mostramos apenas o QR da loja (injetado pelo
  // bundle) e escondemos a camera/validacao. O scanner segue ativo para o cliente.
  const viewerIsEmpresa = (() => {
    try {
      const raw = localStorage.getItem('tem_de_tudo_user');
      if (!raw) return false;
      const u = JSON.parse(raw) || {};
      const perfil = String(u.perfil || u.role || u.tipo || '').toLowerCase();
      return perfil === 'empresa';
    } catch { return false; }
  })();

  // A empresa TAMBEM le: e assim que ela credita ponto e valida beneficio no
  // balcao. O cliente le o QR da loja para entrar; a loja le o QR do cliente
  // para lancar. Os dois caminhos existem e usam a mesma camera.
  if (viewerIsEmpresa) {
    const dica = document.getElementById('scanCameraHint');
    if (dica) dica.textContent = 'Aponte para o QR do cliente para lancar pontos ou validar um beneficio.';
    if (instructionEl) instructionEl.textContent = 'Peca ao cliente para abrir "Meu cartao" no app.';
    if (video) {
      if (appReady) { startCamera(); } else {
        window.addEventListener('tdt-app-ready', () => startCamera(), { once: true });
      }
    }
  } else if (video) {
    if (appReady) {
      startCamera();
    } else {
      window.addEventListener('tdt-app-ready', () => startCamera(), { once: true });
    }
  }

  window.addEventListener('beforeunload', () => {
    scanning = false;
    if (stream) {
      stream.getTracks().forEach((track) => track.stop());
    }
  });
})();
</script>

  <script>
  /* BALCAO
     Uma leitura do QR do cliente traz tudo que o caixa precisa decidir:
     /empresa/clientes/qrcode/consultar ja devolve vinculo, cartao fidelidade com
     progresso, bonus de adesao, bonus de aniversario e promocoes, cada um com o
     seu proprio can_validate. Entao a tela nao pergunta nada: mostra so os botoes
     que o servidor autorizou, com o carimbo da visita em primeiro lugar.
     O cliente nunca credita a si mesmo - por isso quem le e a loja. */
  (function () {
    var painel = document.getElementById('empresaScanResult');
    var corpo = document.getElementById('ercCorpo');
    if (!painel || !corpo) return;

    function ehEmpresa() {
      try {
        var u = JSON.parse(localStorage.getItem('tem_de_tudo_user') || '{}');
        return String(u.perfil || u.role || u.tipo || '').toLowerCase() === 'empresa';
      } catch (e) { return false; }
    }
    if (!ehEmpresa()) return;

    function esc(v) {
      return String(v == null ? '' : v).replace(/[&<>"']/g, function (ch) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
      });
    }

    async function api(rota, opcoes) {
      var o = opcoes || {};
      o.headers = Object.assign({
        'Accept': 'application/json',
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + (localStorage.getItem('tem_de_tudo_token') || '')
      }, o.headers || {});
      var res = await fetch('/api' + rota, o);
      var json = await res.json().catch(function () { return {}; });
      return { ok: res.ok && json.success !== false, json: json };
    }

    function aviso(texto, tipo) {
      var box = document.getElementById('ercAviso');
      if (!box) return;
      box.textContent = texto || '';
      box.className = texto ? 'ap-msg ap-msg--' + (tipo || 'info') : 'ap-msg hidden';
      if (texto) box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    /* Redesenha a barra a partir do snapshot devolvido pela acao, para o caixa
       ver o novo saldo do cartao sem ter que ler o QR de novo. */
    function pintarProgresso(snapshot) {
      var p = snapshot && snapshot.progress;
      if (!p) return;
      var barra = document.getElementById('ercProgresso');
      var texto = document.getElementById('ercProgressoTxt');
      if (barra) barra.style.width = Math.max(0, Math.min(100, Number(p.percentage) || 0)) + '%';
      if (texto) texto.textContent = p.progress_label || '';
      var resgate = corpo.querySelector('[data-acao="recompensa"]');
      if (resgate) resgate.classList.toggle('hidden', !p.reward_available);
      var ponto = corpo.querySelector('[data-acao="ponto"]');
      if (ponto && snapshot.can_add_point === false) ponto.classList.add('hidden');
    }

    async function acao(botao, chamada, mensagemOk, aoConcluir) {
      if (botao.disabled) return;
      botao.disabled = true;
      var rotulo = botao.innerHTML;
      botao.innerHTML = '<span class="material-symbols-outlined">hourglass_top</span> Enviando...';
      aviso('');
      try {
        var r = await chamada();
        if (r.ok) {
          if (navigator.vibrate) navigator.vibrate(120);
          aviso(mensagemOk, 'success');
          var d = (r.json && r.json.data) || {};
          pintarProgresso(d.cartao_fidelidade || d);
          botao.innerHTML = rotulo;
          if (aoConcluir) aoConcluir(botao);
          return true;
        }
        aviso((r.json && r.json.message) || 'Nao foi possivel concluir a operacao.', 'error');
      } catch (e) {
        aviso('Erro de rede. Confira a conexao e tente de novo.', 'error');
      }
      botao.disabled = false;
      botao.innerHTML = rotulo;
      return false;
    }

    function concluido(botao, texto) {
      botao.disabled = true;
      botao.classList.add('tdt-btn--done');
      botao.innerHTML = '<span class="material-symbols-outlined">check_circle</span> ' + esc(texto);
    }

    function desenhar(dados) {
      var d = dados || {};
      var cli = d.cliente || {};
      var vinculo = d.vinculo || {};
      var fid = d.cartao_fidelidade || {};
      var prog = fid.progress || {};
      var adesao = d.bonus_adesao || {};
      var aniversario = d.bonus_aniversario || {};
      var promos = (d.promocoes && d.promocoes.items) || [];
      var promosValidaveis = promos.filter(function (p) {
        return p.can_present_qr === true || p.viewer_status === 'available';
      });

      var iniciais = String(cli.nome || '?').trim().split(/\s+/).slice(0, 2)
        .map(function (p) { return p.charAt(0).toUpperCase(); }).join('');

      var partes = [];

      partes.push(
        '<div class="erc-head">' +
          '<div class="tdt-client-card__avatar erc-avatar">' + esc(iniciais) + '</div>' +
          '<div class="erc-head__b">' +
            '<div class="erc-nome">' + esc(cli.nome || 'Cliente') + '</div>' +
            '<div class="erc-sub">' + esc(cli.telefone || cli.email || '') + '</div>' +
          '</div>' +
        '</div>'
      );

      var selos = ['<span class="tdt-pill ' + (vinculo.existe ? 'tdt-pill--ok' : 'tdt-pill--warn') + '">' +
        (vinculo.existe ? 'Cliente vinculado' : 'Primeira visita') + '</span>'];
      if (promosValidaveis.length) {
        selos.push('<span class="tdt-pill tdt-pill--info">' + promosValidaveis.length +
          (promosValidaveis.length > 1 ? ' promocoes' : ' promocao') + '</span>');
      }
      partes.push('<div class="erc-pills">' + selos.join('') + '</div>');

      // Cartao fidelidade: so aparece quando a loja tem cartao configurado.
      if (fid.card && prog.required_points) {
        partes.push(
          '<div class="erc-prog">' +
            '<div class="erc-prog__top">' +
              '<span>' + esc(fid.card.titulo || 'Cartao fidelidade') + '</span>' +
              '<span id="ercProgressoTxt">' + esc(prog.progress_label || '') + '</span>' +
            '</div>' +
            '<div class="tdt-progress"><div id="ercProgresso" style="width:' +
              (Number(prog.percentage) || 0) + '%"></div></div>' +
            (fid.card.recompensa_descricao
              ? '<div class="erc-prog__rw">Recompensa: ' + esc(fid.card.recompensa_descricao) + '</div>'
              : '') +
          '</div>'
        );
      } else if (fid.message) {
        partes.push('<p class="erc-nota">' + esc(fid.message) + '</p>');
      }

      // Acoes: a do dia a dia primeiro, grande, no alcance do polegar.
      var acoes = [];
      if (fid.can_add_point && fid.card) {
        acoes.push('<button type="button" class="tdt-btn tdt-btn--block erc-acao" data-acao="ponto">' +
          '<span class="material-symbols-outlined">add_circle</span> Carimbar visita' +
          (prog.points_per_visit > 1 ? ' (+' + prog.points_per_visit + ')' : '') + '</button>');
      }
      acoes.push('<button type="button" class="tdt-btn tdt-btn--block erc-acao erc-acao--premio' +
        (fid.can_redeem ? '' : ' hidden') + '" data-acao="recompensa">' +
        '<span class="material-symbols-outlined">workspace_premium</span> Entregar recompensa</button>');

      if (adesao.can_validate && adesao.bonus && adesao.bonus.id) {
        acoes.push('<button type="button" class="tdt-btn tdt-btn--ghost erc-acao" data-acao="adesao" ' +
          'data-id="' + adesao.bonus.id + '"><span class="material-symbols-outlined">redeem</span> ' +
          'Validar ' + esc(adesao.bonus.titulo || 'bonus de adesao') + '</button>');
      }
      if (aniversario.can_validate && aniversario.bonus && aniversario.bonus.id) {
        acoes.push('<button type="button" class="tdt-btn tdt-btn--ghost erc-acao" data-acao="aniversario" ' +
          'data-id="' + aniversario.bonus.id + '"><span class="material-symbols-outlined">cake</span> ' +
          'Validar bonus de aniversario</button>');
      }
      promosValidaveis.forEach(function (p) {
        acoes.push('<button type="button" class="tdt-btn tdt-btn--ghost erc-acao" data-acao="promocao" ' +
          'data-id="' + p.id + '"><span class="material-symbols-outlined">local_offer</span> ' +
          'Validar ' + esc(p.titulo || 'promocao') + '</button>');
      });

      partes.push('<div class="erc-acoes">' + acoes.join('') + '</div>');
      partes.push('<p id="ercAviso" class="ap-msg hidden"></p>');
      partes.push('<button type="button" class="tdt-btn tdt-btn--ghost erc-nova" data-acao="nova">' +
        '<span class="material-symbols-outlined">qr_code_scanner</span> Ler outro cliente</button>');

      corpo.innerHTML = partes.join('');

      corpo.addEventListener('click', function (ev) {
        var botao = ev.target.closest('[data-acao]');
        if (!botao || !corpo.contains(botao)) return;
        var tipo = botao.getAttribute('data-acao');
        var id = botao.getAttribute('data-id');
        var cartaoId = fid.card && fid.card.id;

        if (tipo === 'nova') { window.location.reload(); return; }

        if (tipo === 'ponto' && cartaoId) {
          acao(botao, function () {
            return api('/empresa/cartao-fidelidade/' + cartaoId + '/clientes/' + cli.id + '/adicionar-ponto',
              { method: 'POST' });
          }, 'Visita carimbada para ' + (cli.nome || 'o cliente') + '.');
          return;
        }

        if (tipo === 'recompensa' && cartaoId) {
          acao(botao, function () {
            return api('/empresa/cartao-fidelidade/' + cartaoId + '/clientes/' + cli.id + '/resgatar',
              { method: 'POST' });
          }, 'Recompensa entregue. O cartao recomeca do zero.');
          return;
        }

        var rotas = {
          adesao: '/empresa/bonus-adesao/',
          aniversario: '/empresa/bonus-aniversario/',
          promocao: '/empresa/promocoes/'
        };
        if (rotas[tipo] && id) {
          acao(botao, function () {
            return api(rotas[tipo] + id + '/validar', {
              method: 'POST', body: JSON.stringify({ cliente_id: cli.id })
            });
          }, 'Benefício validado para ' + (cli.nome || 'o cliente') + '.', function (b) {
            concluido(b, 'Validado');
          });
        }
      });

      painel.classList.remove('hidden');
      painel.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function falha(mensagem) {
      corpo.innerHTML = '<p class="ap-msg ap-msg--error" style="margin:0">' + esc(mensagem) + '</p>' +
        '<button type="button" class="tdt-btn tdt-btn--ghost erc-nova" data-acao="nova">' +
        '<span class="material-symbols-outlined">refresh</span> Ler de novo</button>';
      var b = corpo.querySelector('[data-acao="nova"]');
      if (b) b.addEventListener('click', function () { window.location.reload(); });
      painel.classList.remove('hidden');
    }

    async function consultar(codigo) {
      painel.classList.remove('hidden');
      corpo.innerHTML = '<p class="erc-nota" style="margin:0">Consultando cliente...</p>';
      try {
        var r = await api('/empresa/clientes/qrcode/consultar', {
          method: 'POST', body: JSON.stringify({ qrcode: codigo })
        });
        if (!r.ok) {
          falha((r.json && r.json.message) ||
            'QR invalido ou expirado. Peca ao cliente para tocar em atualizar no app.');
          return;
        }
        desenhar(r.json.data || {});
      } catch (e) {
        falha('Erro de rede na consulta. Confira a conexao.');
      }
    }

    window.addEventListener('tdt-qr-scanned', function (ev) {
      var codigo = (ev && ev.detail && ev.detail.codigo) || '';
      if (codigo) consultar(String(codigo).trim());
    });

    var manual = document.getElementById('usarCupomBtn');
    if (manual) {
      manual.addEventListener('click', function () {
        var campo = document.getElementById('cupomId');
        var v = campo && campo.value ? campo.value.trim() : '';
        if (v) consultar(v);
      });
    }
  })();
  </script>
</body>
</html>
