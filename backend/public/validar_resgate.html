<!DOCTYPE html>
<html class="light" lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/><title>Tem de Tudo - Validar Benefícios</title><link href="/img/logo.png" rel="icon" type="image/png"/>
<link href="/img/logo.png" rel="shortcut icon"/>
<link href="/img/apple-touch-icon.png" rel="apple-touch-icon"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link href="/css/tdt-ui.css?v=20260728-ui28" rel="stylesheet" />
  <script src="/js/tdt-app.js?v=20260727-ui1"></script>
<style>
        .glass-panel {
            background: rgba(222, 219, 231, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .qr-scanner-overlay {
            background: linear-gradient(to bottom, transparent 0%, #b01774 50%, transparent 100%);
            height: 2px;
            width: 100%;
            position: absolute;
            animation: scan 2s linear infinite;
        }
        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body data-page="validar_resgate">

<header class="tdt-appbar">
  <div class="tdt-appbar__inner">
    <div class="tdt-appbar__greet">
      <span class="tdt-appbar__hello">Ler QR Code</span>
      <span class="tdt-appbar__sub" id="scanCameraHint">Aponte a câmera para o QR Code.</span>
    </div>
    <div class="tdt-appbar__actions">
      <a href="/meu_perfil.html" class="tdt-icon-btn" aria-label="Meu perfil">
        <span class="material-symbols-outlined">person</span>
      </a>
    </div>
  </div>
</header>

<main class="tdt-panelmain">
  <p class="tdt-k__d" id="scanInstructions" style="text-align:center"></p>

  <section id="qrScannerCamera" class="tdt-scan">
    <video id="qrVideo" class="tdt-scan__video" autoplay playsinline></video>

    <div class="tdt-scan__status" id="scanStatus">Aguardando QR Code...</div>

    <button id="closeQRScanner" class="tdt-scan__close" title="Fechar scanner" type="button">
      <span class="material-symbols-outlined">close</span>
    </button>

    <div class="tdt-scan__frame" id="scanFrame">
      <span class="tdt-scan__c tdt-scan__c--tl"></span>
      <span class="tdt-scan__c tdt-scan__c--tr"></span>
      <span class="tdt-scan__c tdt-scan__c--bl"></span>
      <span class="tdt-scan__c tdt-scan__c--br"></span>
      <span class="material-symbols-outlined tdt-scan__ph" id="qrPlaceholder">qr_code_2</span>
      <div id="scanSuccess" class="hidden tdt-scan__ok">
        <span class="material-symbols-outlined">check_circle</span>
      </div>
    </div>

    <div class="tdt-scan__tools">
      <button id="toggleFlash" class="tdt-scan__tool" type="button">
        <span class="material-symbols-outlined">flashlight_on</span> Lanterna
      </button>
      <button id="switchCamera" class="tdt-scan__tool" type="button">
        <span class="material-symbols-outlined">cameraswitch</span> Trocar
      </button>
    </div>
  </section>

  <p class="tdt-scan__hint">Centralize o QR Code dentro da moldura. A leitura é automática.</p>

  <section id="qrManualSection" class="tdt-panel">
    <h3 class="tdt-panel__t">Sem câmera? Digite o código</h3>
    <div class="tdt-field">
      <input id="cupomId" class="tdt-input" autocomplete="off" type="text"
             placeholder="Cole o código do QR" style="letter-spacing:1px" />
    </div>
    <button id="usarCupomBtn" class="tdt-btn tdt-btn--block" type="button">
      <span class="material-symbols-outlined">verified</span> Validar agora
    </button>
    <div id="validarFeedback" class="hidden tdt-k__d" style="margin-top:12px;text-align:center"></div>
  </section>
</main>

<nav class="app-mobile-dock">
  <div class="app-mobile-dock__inner">
    <a class="app-mobile-dock__item" href="/dashboard_parceiro.html">
      <span class="app-mobile-dock__item-icon"><span class="material-symbols-outlined">home</span></span>
      <span class="app-mobile-dock__item-label">Início</span></a>
    <a class="app-mobile-dock__item" href="/clientes_fidelizados_loja.html">
      <span class="app-mobile-dock__item-icon"><span class="material-symbols-outlined">groups</span></span>
      <span class="app-mobile-dock__item-label">Clientes</span></a>
    <a class="app-mobile-dock__item app-mobile-dock__item--active" href="/validar_resgate.html?modo=beneficios">
      <span class="app-mobile-dock__item-icon"><span class="material-symbols-outlined">qr_code_scanner</span></span>
      <span class="app-mobile-dock__item-label">Validar</span></a>
    <a class="app-mobile-dock__item" href="/minhas_campanhas_loja.html">
      <span class="app-mobile-dock__item-icon"><span class="material-symbols-outlined">campaign</span></span>
      <span class="app-mobile-dock__item-label">Ofertas</span></a>
    <a class="app-mobile-dock__item" href="/meu_perfil.html">
      <span class="app-mobile-dock__item-icon"><span class="material-symbols-outlined">person</span></span>
      <span class="app-mobile-dock__item-label">Perfil</span></a>
  </div>
</nav>

<script src="/dist/stitch-app.min.js?v=20260721-app51"></script>
  <!-- Scanner de camera: este script existia na versao anterior e se perdeu na
       reescrita da tela. Sem ele a camera nunca liga. -->
  <script>
(function () {
  const video = document.getElementById('qrVideo');
  const statusText = document.getElementById('scanStatus');
  const placeholder = document.getElementById('qrPlaceholder');
  const successIndicator = document.getElementById('scanSuccess');
  const toggleFlashBtn = document.getElementById('toggleFlash');
  const switchCameraBtn = document.getElementById('switchCamera');

  let stream = null;
  let facingMode = 'environment';
  let scanning = true;
  let lastScannedCode = null;
  let lastScanTime = 0;
  const scanCooldown = 3000;

  // Fluxo único de QR: o cliente lê o QR da empresa. A empresa nunca escaneia
  // ninguém nesta página — ela apenas exibe o QR da loja (injetado pelo bundle).
  const storedUser = JSON.parse(localStorage.getItem('tem_de_tudo_user') || '{}');
  const perfil = (storedUser.perfil || storedUser.role || '').toLowerCase();
  const isEmpresa = ['empresa', 'estabelecimento', 'parceiro'].includes(perfil);
  const instructionEl = document.getElementById('scanInstructions');
  let appReady = Boolean(window.__tdtAppReady);
  let scanPending = false;

  if (instructionEl && !isEmpresa) {
    instructionEl.textContent = 'Escaneie o QR da empresa para se vincular no app.';
  }

  const resetScannerUi = () => {
    successIndicator.classList.add('hidden');
    placeholder.classList.remove('hidden');
    statusText.classList.remove('text-error', 'text-primary', 'text-tertiary');
    statusText.textContent = 'Escaneie o QR da empresa...';
  };

  const resumeScanning = (delay = 0) => {
    setTimeout(() => {
      scanPending = false;
      resetScannerUi();
      scanning = true;
      requestAnimationFrame(scanQRCode);
    }, delay);
  };

  window.addEventListener('tdt-app-ready', () => {
    appReady = true;
  });

  window.addEventListener('tdt-qr-validation-result', (event) => {
    const result = event?.detail || {};
    if (result.source !== 'camera') return;

    successIndicator.classList.toggle('hidden', !result.ok);

    if (result.ok) {
      statusText.classList.remove('text-error');
      statusText.classList.add('text-tertiary');
      // Vínculo concluído: o bundle redireciona para a página da empresa.
      statusText.textContent = result.message || 'QR validado com sucesso.';
      return;
    }

    successIndicator.classList.add('hidden');
    statusText.classList.remove('text-primary', 'text-tertiary');
    statusText.classList.add('text-error');
    statusText.textContent = result.message || 'Nao foi possivel validar este QR.';
    resumeScanning(2600);
  });

  async function startCamera() {
    try {
      if (stream) {
        stream.getTracks().forEach((track) => track.stop());
      }

      const constraints = {
        video: {
          facingMode,
          width: { ideal: 1280 },
          height: { ideal: 720 },
        },
      };

      stream = await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject = stream;
      placeholder.classList.add('hidden');
      statusText.textContent = 'Camera ativa - escaneie o QR da empresa';

      requestAnimationFrame(scanQRCode);
    } catch (error) {
      const unsupportedCamera = ['NotSupportedError', 'NotFoundError', 'OverconstrainedError'].includes(error?.name || '');
      if (unsupportedCamera) {
        console.warn('camera_unavailable', error?.name || error);
        statusText.textContent = 'Camera indisponivel neste dispositivo ou navegador';
      } else if ((error?.name || '') === 'NotAllowedError') {
        console.warn('camera_permission_denied');
        statusText.textContent = 'Permita o acesso a camera para continuar';
      } else {
        console.warn('camera_start_failed', error?.name || error);
        statusText.textContent = 'Nao foi possivel iniciar a camera agora';
      }
      statusText.classList.add('text-error');
    }
  }

  function scanQRCode() {
    if (!scanning || video.readyState !== video.HAVE_ENOUGH_DATA) {
      if (scanning) requestAnimationFrame(scanQRCode);
      return;
    }

    const canvas = document.createElement('canvas');
    const context = canvas.getContext('2d');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    context.drawImage(video, 0, 0, canvas.width, canvas.height);

    const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
    const code = jsQR(imageData.data, imageData.width, imageData.height, {
      inversionAttempts: 'dontInvert',
    });

    if (code && code.data) {
      const now = Date.now();
      if (code.data !== lastScannedCode || (now - lastScanTime) > scanCooldown) {
        lastScannedCode = code.data;
        lastScanTime = now;
        handleQRCodeDetected(code.data);
      }
    }

    if (scanning) {
      requestAnimationFrame(scanQRCode);
    }
  }

  async function handleQRCodeDetected(qrData) {
    placeholder.classList.add('hidden');
    successIndicator.classList.remove('hidden');
    statusText.textContent = 'QR Code detectado! Validando...';
    statusText.classList.add('text-primary');

    if (navigator.vibrate) {
      navigator.vibrate(200);
    }

    if (!appReady) {
      statusText.textContent = 'Preparando validacao...';
      statusText.classList.remove('text-error');
      statusText.classList.add('text-tertiary');
      resumeScanning(900);
      return;
    }

    if (scanPending) {
      return;
    }

    scanPending = true;
    scanning = false;
    const manualInput = document.getElementById('cupomId');
    if (manualInput) manualInput.value = qrData;
    window.dispatchEvent(new CustomEvent('tdt-qr-scanned', {
      detail: {
        codigo: qrData,
        source: 'camera',
      },
    }));
    return;

  }

  toggleFlashBtn.addEventListener('click', async () => {
    if (!stream) return;

    const track = stream.getVideoTracks()[0];
    const capabilities = track.getCapabilities();

    if (!capabilities.torch) {
      alert('Lanterna não disponível neste dispositivo');
      return;
    }

    const current = track.getSettings();
    const newState = !current.torch;
    await track.applyConstraints({ advanced: [{ torch: newState }] });
    toggleFlashBtn.classList.toggle('bg-primary', newState);
    toggleFlashBtn.classList.toggle('text-white', newState);
  });

  switchCameraBtn.addEventListener('click', () => {
    facingMode = facingMode === 'environment' ? 'user' : 'environment';
    startCamera();
  });

  document.getElementById('closeQRScanner').addEventListener('click', () => {
    scanning = false;
    scanPending = false;
    if (stream) {
      stream.getTracks().forEach((track) => track.stop());
    }
    const fallback = isEmpresa ? '/dashboard_parceiro.html' : '/meus_pontos.html';
    const sameOriginReferrer = document.referrer && (() => {
      try {
        return new URL(document.referrer).origin === window.location.origin;
      } catch {
        return false;
      }
    })();
    if (window.history.length > 1 && sameOriginReferrer) {
      window.history.back();
      return;
    }
    window.location.href = fallback;
  });

  // A empresa NAO escaneia mais o cliente: o cliente e quem le o QR da empresa.
  // Nesta pagina, para a empresa, mostramos apenas o QR da loja (injetado pelo
  // bundle) e escondemos a camera/validacao. O scanner segue ativo para o cliente.
  const viewerIsEmpresa = (() => {
    try {
      const raw = localStorage.getItem('tem_de_tudo_user');
      if (!raw) return false;
      const u = JSON.parse(raw) || {};
      const perfil = String(u.perfil || u.role || u.tipo || '').toLowerCase();
      return perfil === 'empresa';
    } catch { return false; }
  })();

  if (viewerIsEmpresa) {
    document.getElementById('qrScannerCamera')?.classList.add('hidden');
    document.getElementById('qrManualSection')?.classList.add('hidden');
    document.getElementById('scanCameraHint')?.classList.add('hidden');
  } else if (video) {
    if (appReady) {
      startCamera();
    } else {
      window.addEventListener('tdt-app-ready', () => startCamera(), { once: true });
    }
  }

  window.addEventListener('beforeunload', () => {
    scanning = false;
    if (stream) {
      stream.getTracks().forEach((track) => track.stop());
    }
  });
})();
</script>
</body>
</html>
