<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Painel da Revenda - Tem de Tudo</title>
  <meta name="theme-color" content="#ffffff" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" href="/img/logo.png" />
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
  <link href="/css/tdt-ui.css?v=20260728-ui45" rel="stylesheet" />
  <script src="/js/tdt-app.js?v=20260728-ui45"></script>
</head>
<body data-page="revenda_painel">

  <header class="tdt-appbar">
    <div class="tdt-appbar__inner">
      <div class="tdt-appbar__greet">
        <span class="tdt-appbar__hello">Painel da Revenda</span>
        <span class="tdt-appbar__sub">Seus estabelecimentos e seu saldo</span>
      </div>
      <div class="tdt-appbar__actions">
        <button id="revLogout" type="button" class="tdt-icon-btn" aria-label="Sair">
          <span class="material-symbols-outlined">logout</span>
        </button>
      </div>
    </div>
  </header>

  <main class="tdt-panelmain">

    <!-- SALDO: e dele que sai o custo de cada estabelecimento criado, entao
         fica no heroi, junto do botao que gasta esse saldo. -->
    <section class="tdt-hero">
      <div class="tdt-hero__label">Seu saldo</div>
      <h1 class="tdt-hero__title" id="revSaldo">R$ --</h1>
      <p class="tdt-hero__text" id="revVencimento">Carregando…</p>
      <div class="tdt-hero__actions" style="grid-template-columns:minmax(0,1fr)">
        <button id="btnRevNovaEmpresa" type="button" class="tdt-btn tdt-btn--light">
          <span class="material-symbols-outlined">add_business</span> Cadastrar estabelecimento
        </button>
      </div>
    </section>

    <section class="tdt-kgrid">
      <div class="tdt-k">
        <div class="tdt-k__l"><span class="material-symbols-outlined">storefront</span> Estabelecimentos</div>
        <div class="tdt-k__v" id="revTotalEmpresas">--</div>
      </div>
      <div class="tdt-k">
        <div class="tdt-k__l"><span class="material-symbols-outlined">check_circle</span> Ativos</div>
        <div class="tdt-k__v" id="revTotalAtivos">--</div>
      </div>
    </section>

    <section>
      <div class="tdt-section__head">
        <h2 class="tdt-section__title">Meus estabelecimentos</h2>
      </div>

      <div id="revEmpresasSkeleton" class="tdt-list">
        <div class="tdt-skel-row">
          <div style="flex:1">
            <div class="tdt-skel-box" style="width:55%;height:14px"></div>
            <div class="tdt-skel-box" style="width:35%;height:11px;margin-top:8px"></div>
          </div>
        </div>
        <div class="tdt-skel-row">
          <div style="flex:1">
            <div class="tdt-skel-box" style="width:45%;height:14px"></div>
            <div class="tdt-skel-box" style="width:40%;height:11px;margin-top:8px"></div>
          </div>
        </div>
      </div>

      <div id="revEmpresasEmpty" class="tdt-empty hidden">
        <div class="tdt-empty__icon"><span class="material-symbols-outlined">storefront</span></div>
        <p style="margin:0">Nenhum estabelecimento ainda.<br>
          Toque em <b>Cadastrar</b> para criar o primeiro — o valor do plano sai do seu saldo.</p>
      </div>

      <div id="revEmpresasList" class="tdt-list"></div>
    </section>
  </main>

  <script src="/dist/stitch-app.min.js?v=20260721-app56"></script>
</body>
</html>
