<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Recuperar senha - Tem de Tudo</title>
  <meta name="theme-color" content="#ffffff" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="/img/logo.png" />
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <link href="/css/tdt-ui.css?v=20260728-ui43" rel="stylesheet" />
  <script src="/js/tdt-app.js?v=20260728-ui43"></script>
</head>
<body class="ap-authbody" data-page="forgot_password">

<section class="ap-auth__brand">
  <a class="ap-auth__logo" href="/">
    <img src="/img/logo.png" alt="" style="width:38px;height:38px;border-radius:12px;object-fit:contain;background:#fff;padding:4px" />
    Tem de Tudo
  </a>
  <div class="ap-auth__claim">
    <h1>Esqueceu a senha?<br>Acontece.</h1>
    <p>Enviamos um link de redefinição para o seu e-mail. Ele vale por 60 minutos.</p>
    
  </div>
</section>

<section class="ap-auth__form">
  <button class="ap-themebtn ap-auth__theme" type="button" data-tdt-theme-toggle>
    <span class="material-symbols-outlined" data-tdt-theme-icon>dark_mode</span>
    <span data-tdt-theme-label>Escuro</span>
  </button>
  <div class="ap-auth__box">
    <h2 class="ap-auth__t">Recuperar senha</h2>
    <p class="ap-auth__s">Informe o e-mail cadastrado. Se existir uma conta, o link chega em alguns minutos.</p>

    <form id="fpForm">
      <div class="ap-field">
        <label class="ap-field__l" for="fpEmail">E-mail</label>
        <input class="ap-input" id="fpEmail" type="email" placeholder="voce@email.com" autocomplete="email" />
      </div>
      <button class="ap-btn" type="submit">Enviar link de redefinição</button>
      <p id="fpMessage" style="margin:14px 0 0;font-size:13.5px;text-align:center;color:var(--text-muted)"></p>
    </form>

    <p class="ap-auth__foot"><a href="/entrar.html" class="ap-link">Voltar para o login</a></p>
  </div>
</section>

<script src="/dist/stitch-app.min.js?v=20260721-app54"></script>
</body>
</html>
